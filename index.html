<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycling Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.7/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0e1117;--bg2:#161b22;--bg3:#1c2129;--tx:#e6edf3;--tx2:#9aa5b4;--tx3:#626d7a;--bd:#30363d;--bd2:#21262d;--green:#2ea66a;--greenA:rgba(46,166,106,.12);--orange:#d18616;--red:#da3633;--pink:#db61a2;--r:10px}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.4}
.wrap{max-width:840px;margin:0 auto;padding:24px 20px 60px}
.upload-zone{border:2px dashed var(--bd);border-radius:var(--r);padding:36px 24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:20px;position:relative}
.upload-zone:hover,.upload-zone.drag{border-color:var(--green);background:var(--greenA)}
.upload-zone h2{font-size:16px;font-weight:500;margin-bottom:4px}
.upload-zone p{color:var(--tx2);font-size:12px}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.file-chip{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer;transition:all .15s}
.file-chip.active{border-color:var(--green);background:var(--greenA);color:var(--green)}
.file-chip .remove{color:var(--tx3);font-size:14px;margin-left:2px;cursor:pointer;border:none;background:none;padding:0}
.file-chip .remove:hover{color:var(--red)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pg{display:flex;gap:0;background:var(--bg3);border-radius:999px;padding:3px}
.pill{border:none;background:transparent;color:var(--tx3);font-family:inherit;font-size:11px;font-weight:500;padding:5px 12px;border-radius:999px;cursor:pointer;transition:all .12s}
.pill.on{background:var(--tx);color:var(--bg)}
input[type="date"]{font-family:inherit;font-size:11px;background:var(--bg3);color:var(--tx2);border:1px solid var(--bd);border-radius:6px;padding:5px 10px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
.kpi{padding:14px 16px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.kpi:nth-child(4n){border-right:none}.kpi:nth-child(n+5){border-bottom:none}
.kpi-label{font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.kpi-val{font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1}
.kpi-unit{font-size:12px;font-weight:400;color:var(--tx3);margin-left:3px}
.kpi-sub{font-size:10px;color:var(--tx3);margin-top:3px}
.tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--bd)}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 18px;font-family:inherit;font-size:13px;font-weight:400;color:var(--tx3);cursor:pointer}
.tab.on{color:var(--tx);font-weight:600;border-bottom-color:var(--tx)}
.st{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin-bottom:10px;margin-top:28px}
.ss{font-size:11px;color:var(--tx3);margin-top:-6px;margin-bottom:10px}
.heatmap{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px}
.hm-col{display:flex;flex-direction:column;gap:2px}
.hm-cell{width:9px;height:9px;border-radius:2px}
.zone-bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin-bottom:8px}
.zone-row{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:4px}
.zone-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.zone-pct{font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto}
.log-wrap{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.log-scroll{max-height:520px;overflow-y:auto}
.log-table{width:100%;border-collapse:collapse;font-size:12px}
.log-table thead{position:sticky;top:0;z-index:1}
.log-table th{background:var(--bg3);padding:8px 6px;text-align:left;font-size:9px;font-weight:600;color:var(--tx3);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--bd)}
.log-table td{padding:7px 6px;border-bottom:1px solid var(--bd2);font-variant-numeric:tabular-nums}
.log-table tr:hover td{background:var(--bg2)}
.log-table input[type="checkbox"]{width:14px;height:14px;margin:0;cursor:pointer;accent-color:var(--green)}
.phase-pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:600;letter-spacing:.03em}
.type-toggle{font-family:inherit;font-size:9px;font-weight:600;padding:2px 8px;border-radius:99px;cursor:pointer;border:1px solid var(--bd);transition:all .12s}
.type-toggle:hover{opacity:.8}
.legend{display:flex;gap:14px;justify-content:center;margin-top:24px;padding-top:14px;border-top:1px solid var(--bd);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--tx3);font-weight:500}
.legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.setting-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd2);font-size:13px;flex-wrap:wrap}
.setting-row select,.setting-row input[type="text"],.setting-row input[type="color"]{font-family:inherit;font-size:12px;background:var(--bg3);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
.setting-row input[type="color"]{width:36px;height:28px;padding:2px;cursor:pointer}
.setting-row input[type="text"]{width:90px}
.setting-row select{width:85px}
.btn-sm{font-family:inherit;font-size:11px;font-weight:500;padding:5px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);cursor:pointer}
.btn-sm:hover{border-color:var(--tx3);color:var(--tx)}
.btn-sm.danger{border-color:var(--red);color:var(--red)}
.btn-sm.danger:hover{background:var(--red);color:#fff}
.tip{position:absolute;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:16px 20px;font-size:12px;line-height:1.7;color:var(--tx2);z-index:10;box-shadow:0 8px 32px rgba(0,0,0,.3);width:420px;max-width:90vw}
.tip b{color:var(--tx);font-weight:600}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2n){border-right:none}.controls{flex-direction:column;align-items:flex-start}.tip{width:280px}}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px">
    <div>
      <div style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:3px">Cycling Analytics</div>
      <div style="font-size:22px;font-weight:500">Fitness-Dashboard</div>
    </div>
    <div id="score-box" style="text-align:right;display:none;position:relative;cursor:help" onmouseenter="document.getElementById('stip').style.display=''" onmouseleave="document.getElementById('stip').style.display='none'">
      <div style="display:flex;align-items:baseline;justify-content:flex-end;gap:3px">
        <span id="sv" style="font-size:38px;font-weight:500;letter-spacing:-.03em;line-height:1"></span>
        <span style="font-size:13px;color:var(--tx3)">/100</span>
      </div>
      <div id="ss" style="font-size:10px;color:var(--tx3);margin-top:2px"></div>
      <div id="stip" class="tip" style="display:none;right:0;top:68px;text-align:left"></div>
    </div>
  </div>

  <div id="dashboard" style="display:none">
    <div class="controls"><div class="pg" id="presets"></div><input type="date" id="fd"><span style="color:var(--tx3);font-size:11px">–</span><input type="date" id="td"><span style="color:var(--tx3);font-size:11px;margin-left:8px" id="ri"></span></div>
    <div class="controls" style="margin-bottom:20px"><div class="pg" id="tf"></div></div>
    <div class="kpi-grid" id="kpis"></div>
    <div class="tabs" id="tabs"></div>
    <div id="tc"></div>
    <div class="legend" id="leg"></div>
  </div>

  <div class="upload-zone" id="uz">
    <h2>Garmin CSV hochladen</h2>
    <p>Drag & Drop oder klicken · Activities.csv von Garmin Connect</p>
    <input type="file" accept=".csv" multiple id="fi">
  </div>
  <div class="file-list" id="fl"></div>
</div>
<script>
const S={files:[],af:-1,fd:'',td:'',pr:0,vw:'monthly',mt:'km',tab:'overview',ch:{},ex:new Set(),tf:'all',phases:null,to:{}};
const DP=[{name:'Einstieg',from:'2025-06',to:'2025-06',bg:'#AFA9EC',fg:'#5B4FC7'},{name:'Aufbau',from:'2025-07',to:'2025-07',bg:'#88DCBC',fg:'#137A5E'},{name:'Peak',from:'2025-08',to:'2025-09',bg:'#44C495',fg:'#0C5E3F'},{name:'Pause',from:'2026-01',to:'2026-01',bg:'#EB8585',fg:'#8B2222'},{name:'Comeback',from:'2026-02',to:'2026-12',bg:'#6BABDF',fg:'#114E80'}];
function lp(){try{const s=localStorage.getItem('cd-p');if(s){S.phases=JSON.parse(s);return;}}catch(e){}S.phases=JSON.parse(JSON.stringify(DP));}
function sp(){try{localStorage.setItem('cd-p',JSON.stringify(S.phases));}catch(e){}}
function lto(){try{const s=localStorage.getItem('cd-to');if(s)S.to=JSON.parse(s);}catch(e){}}
function sto(){try{localStorage.setItem('cd-to',JSON.stringify(S.to));}catch(e){}}
lp();lto();
function gp(d){const ym=d.slice(0,7);for(const p of S.phases)if(ym>=p.from&&ym<=p.to)return p;return{name:'–',bg:'#555',fg:'#ccc'};}

const PR=[{l:'Gesamt'},{l:"Sommer '25",f:'2025-06-01',t:'2025-09-30'},{l:'Indoor',f:'2025-10-01',t:'2025-12-31'},{l:'2026',f:'2026-01-01',t:'2026-12-31'},{l:'8 Wo',r:56},{l:'4 Wo',r:28}];
const ML={"01":"Jan","02":"Feb","03":"Mär","04":"Apr","05":"Mai","06":"Jun","07":"Jul","08":"Aug","09":"Sep","10":"Okt","11":"Nov","12":"Dez"};
const nu=s=>{if(!s||s==='--'||s==='-'||s==='')return null;return parseFloat(s.replace(/\./g,'').replace(',','.'));};
const fm=(v,d=0)=>v==null?'–':d===0?Math.round(v).toLocaleString('de-DE'):v.toFixed(d).replace('.',',');
const ft=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?h+'h '+m+'m':m+'m';};
const trimp=(hr,s)=>hr&&s?(s/60)*Math.pow(hr/195,2):0;
function pt(s){if(!s||s==='--')return 0;s=s.trim().replace(',','.');const p=s.split(':');if(p.length===3)return parseInt(p[0])*3600+parseInt(p[1])*60+parseFloat(p[2]);if(p.length===2)return parseInt(p[0])*60+parseFloat(p[1]);return 0;}
function pd(s){if(!s)return null;s=s.trim().slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);if(m)return m[3]+'-'+m[2]+'-'+m[1];return null;}
function iw(ds){const d=new Date(ds+'T12:00:00'),th=new Date(d);th.setDate(th.getDate()+3-((th.getDay()+6)%7));const y1=new Date(th.getFullYear(),0,4);const w=1+Math.round(((th-y1)/864e5-(3-(y1.getDay()+6)%7))/7);return th.getFullYear()+'-W'+String(w).padStart(2,'0');}
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)].join(',');}
function ae(r){if(!r.hr||!r.v)return null;const c=r.km>0?r.hm/r.km:0;return r.hr/(r.v+c*0.3);}

// CSV
function parseCSV(text){
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');const hdr=text.split('\n')[0];const sc=hdr.split(';').length,cm=hdr.split(',').length;const dl=hdr.includes('\t')?'\t':sc>cm?';':',';
  function sr(line){const f=[];let fd='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(q){if(c==='"'){if(i+1<line.length&&line[i+1]==='"'){fd+='"';i++;}else q=false;}else fd+=c;}else{if(c==='"')q=true;else if(c===dl){f.push(fd.trim());fd='';}else fd+=c;}}f.push(fd.trim());return f;}
  const lines=text.split('\n'),hdrs=sr(lines[0]),rows=[];
  for(let i=1;i<lines.length;i++){if(!lines[i].trim())continue;const v=sr(lines[i]);if(v.length<5)continue;const o={};hdrs.forEach((h,j)=>o[h]=v[j]||'');rows.push(o);}return rows;
}
function proc(text){
  const rows=parseCSV(text),data=[],seen=new Set();let id=0;
  for(const r of rows){
    const typ=r['Aktivitätstyp']||'';
    if(typ.includes('E-Bike')||typ.includes('E-Mountain')||typ.includes('Laufen')||typ.includes('Gehen')||typ.includes('Wandern')||typ.includes('Schwimmen'))continue;
    if(!typ.includes('Rad')&&!typ.includes('Gravel')&&!typ.includes('Indoor')&&!typ.includes('Cycling'))continue;
    const d=pd(r['Datum']);if(!d)continue;const km=nu(r['Distanz']);if(!km||km<=0)continue;
    const key=d+'|'+km+'|'+r['Zeit'];if(seen.has(key))continue;seen.add(key);
    const rid=d+'_'+id++;const at=(typ.includes('Virtuell')||typ.includes('Indoor'))?'I':'O';
    data.push({id:rid,d,t:S.to[rid]||at,typ,title:r['Titel']||'',km,s:pt(r['Zeit']),hr:nu(r['Ø Herzfrequenz']),v:nu(r['Ø Geschwindigkeit']),hm:nu(r['Anstieg gesamt'])||0,rpm:nu(r['Ø Trittfrequenz']),cal:nu(r['Kalorien'])||0});
  }
  data.sort((a,b)=>a.d.localeCompare(b.d));return data;
}

// Files
const uz=document.getElementById('uz'),fi=document.getElementById('fi');
uz.addEventListener('dragover',e=>{e.preventDefault();uz.classList.add('drag');});
uz.addEventListener('dragleave',()=>uz.classList.remove('drag'));
uz.addEventListener('drop',e=>{e.preventDefault();uz.classList.remove('drag');hf(e.dataTransfer.files);});
fi.addEventListener('change',e=>hf(e.target.files));
function hf(files){for(const file of files){if(!file.name.endsWith('.csv'))continue;const r=new FileReader();r.onload=e=>{const data=proc(e.target.result);if(!data.length)return;const i=S.files.findIndex(f=>f.name===file.name);if(i>=0)S.files[i].data=data;else S.files.push({name:file.name,data});S.af=S.files.length-1;idr();render();};r.readAsText(file,'UTF-8');}}
function idr(){const d=ga();if(!d.length)return;const ds=d.map(r=>r.d).sort();S.fd=ds[0];S.td=new Date().toISOString().slice(0,10);S.pr=0;document.getElementById('fd').value=S.fd;document.getElementById('td').value=S.td;}
function ga(){if(S.af<0||!S.files[S.af])return[];return S.files[S.af].data;}
function gf(){let d=ga().filter(r=>r.d>=S.fd&&r.d<=S.td&&!S.ex.has(r.id));if(S.tf==='O')d=d.filter(r=>r.t==='O');if(S.tf==='I')d=d.filter(r=>r.t==='I');return d;}
function sf(i){S.af=i;S.ex.clear();idr();render();}
function rf(i){S.files.splice(i,1);if(S.af>=S.files.length)S.af=S.files.length-1;if(S.files.length)idr();render();}

// Render
function render(){
  const has=S.files.length>0;document.getElementById('dashboard').style.display=has?'':'none';
  rfc();if(!has)return;rpr();rtf();rri();rkpi();rtabs();rtc();rsc();rleg();
}
function rfc(){document.getElementById('fl').innerHTML=S.files.map((f,i)=>'<div class="file-chip '+(i===S.af?'active':'')+'" onclick="sf('+i+')"><span>'+f.name+'</span><span class="count" style="color:var(--tx3)">'+f.data.length+'</span><button class="remove" onclick="event.stopPropagation();rf('+i+')">×</button></div>').join('');}
function rpr(){document.getElementById('presets').innerHTML=PR.map((p,i)=>'<button class="pill '+(S.pr===i?'on':'')+'" onclick="ap('+i+')">'+p.l+'</button>').join('');}
function rtf(){document.getElementById('tf').innerHTML=[['all','Alle'],['O','Outdoor'],['I','Indoor']].map(([k,l])=>'<button class="pill '+(S.tf===k?'on':'')+'" onclick="stf(\''+k+'\')">'+l+'</button>').join('');}
function stf(t){S.tf=t;render();}
function ap(i){S.pr=i;const p=PR[i];if(p.r){const e=new Date(),s=new Date(e-p.r*864e5);S.fd=s.toISOString().slice(0,10);S.td=e.toISOString().slice(0,10);}else if(p.f){S.fd=p.f;S.td=p.t;}else{const ds=ga().map(r=>r.d).sort();S.fd=ds[0]||'2025-01-01';S.td=new Date().toISOString().slice(0,10);}document.getElementById('fd').value=S.fd;document.getElementById('td').value=S.td;render();}
document.getElementById('fd').addEventListener('change',e=>{S.fd=e.target.value;S.pr=-1;render();});
document.getElementById('td').addEventListener('change',e=>{S.td=e.target.value;S.pr=-1;render();});
function rri(){const d=gf();document.getElementById('ri').textContent=d.length+' Aktivitäten · '+new Set(d.map(r=>r.d)).size+' Tage';}
function rleg(){document.getElementById('leg').innerHTML=S.phases.map(p=>'<span><span class="legend-dot" style="background:'+p.bg+'"></span>'+p.name+'</span>').join('');}

// KPIs
function rkpi(){
  const d=gf(),km=d.reduce((s,r)=>s+r.km,0),sec=d.reduce((s,r)=>s+r.s,0),hm=d.reduce((s,r)=>s+r.hm,0),cal=d.reduce((s,r)=>s+r.cal,0);
  const wH=d.filter(r=>r.hr),wV=d.filter(r=>r.v),wR=d.filter(r=>r.rpm);
  const aHr=wH.length?wH.reduce((s,r)=>s+r.hr,0)/wH.length:null,aV=wV.length?wV.reduce((s,r)=>s+r.v,0)/wV.length:null,aR=wR.length?wR.reduce((s,r)=>s+r.rpm,0)/wR.length:null;
  const wk=Math.max(1,Math.ceil((new Date(S.td)-new Date(S.fd))/6048e5));
  const k=[{l:'Distanz',v:fm(km),u:'km',s:d.filter(r=>r.t==='O').length+' outdoor · '+d.filter(r=>r.t==='I').length+' indoor'},{l:'Fahrzeit',v:ft(sec),u:'',s:'Ø '+ft(d.length?sec/d.length:0)+' / Einheit'},{l:'Höhenmeter',v:fm(hm),u:'hm',s:''},{l:'Kalorien',v:fm(cal),u:'kcal',s:''},{l:'Ø Herzfrequenz',v:fm(aHr),u:'bpm',s:''},{l:'Ø Geschwindigkeit',v:fm(aV,1),u:'km/h',s:''},{l:'Ø Kadenz',v:fm(aR),u:'rpm',s:''},{l:'Ø / Woche',v:fm(km/wk),u:'km',s:''}];
  document.getElementById('kpis').innerHTML=k.map(x=>'<div class="kpi"><div class="kpi-label">'+x.l+'</div><div class="kpi-val">'+x.v+'<span class="kpi-unit">'+x.u+'</span></div>'+(x.s?'<div class="kpi-sub">'+x.s+'</div>':'')+'</div>').join('');
}

// Score
function rsc(){
  const d=gf().filter(r=>r.hr&&r.v&&r.s>900&&r.t==='O');const el=document.getElementById('score-box');
  if(d.length<3){el.style.display='none';return;}el.style.display='';
  const ef=d.map(r=>ae(r)),b=Math.min(...ef),w=Math.max(...ef),rn=w-b||1,cu=ef[ef.length-1],pv=ef.length>=4?ef[ef.length-4]:cu;
  const sc=v=>Math.round(((w-v)/rn)*100),tr=cu<pv?'up':'down';
  const li=d[d.length-1],bi=d[ef.indexOf(b)];
  document.getElementById('sv').textContent=sc(cu);
  document.getElementById('sv').style.color=tr==='up'?'var(--green)':'var(--orange)';
  document.getElementById('ss').textContent=(tr==='up'?'↗':'↘')+' Fitness · Peak '+sc(b);
  document.getElementById('stip').innerHTML='<b>Fitness-Score: '+sc(cu)+'/100</b><br><br>Der Score basiert auf der <b>höhenbereinigten Effizienz</b> (HF ÷ adjustierte Geschwindigkeit) deiner Outdoor-Fahrten über 15 Minuten.<br><br><b>Formel:</b> Effizienz = HF ÷ (Speed + Höhenmeter/km × 0,3)<br>Niedrigere Werte = fitter (weniger Herzschläge pro km/h).<br><br><b>Aktuell:</b> '+fm(cu,2)+' ('+li.d+' · '+fm(li.km,1)+'km · '+li.hr+'bpm · '+fm(li.v,1)+'km/h)<br><b>Peak:</b> '+fm(b,2)+' ('+bi.d+' · '+fm(bi.km,1)+'km)<br><br>Score = Position zwischen schlechtestem und bestem Wert, skaliert 0–100. Basiert auf '+d.length+' Outdoor-Fahrten.';
}

// Tabs
function rtabs(){document.getElementById('tabs').innerHTML=[['overview','Übersicht'],['performance','Leistung'],['log','Aktivitäten'],['settings','⚙ Phasen']].map(([k,l])=>'<button class="tab '+(S.tab===k?'on':'')+'" onclick="st(\''+k+'\')">'+l+'</button>').join('');}
function st(t){S.tab=t;render();}
function rtc(){const el=document.getElementById('tc');Object.values(S.ch).forEach(c=>{try{c.destroy();}catch(e){}});S.ch={};if(S.tab==='overview')rov(el);else if(S.tab==='performance')rperf(el);else if(S.tab==='settings')rset(el);else rlog(el);}
function smt(m){S.mt=m;render();}
function svw(v){S.vw=v;render();}

// Chart config
const TT={backgroundColor:'#161b22',borderColor:'#30363d',borderWidth:1,padding:12,cornerRadius:8,titleFont:{family:'DM Sans',weight:'600'},bodyFont:{family:'DM Sans'},titleColor:'#e6edf3',bodyColor:'#9aa5b4'};
const GR={color:'rgba(128,128,128,.06)',drawBorder:false};
const XK={font:{family:'DM Sans',size:10},color:'#626d7a'};
const YK={font:{family:'DM Sans',size:10},color:'#626d7a'};

// ═══ OVERVIEW ═══
function rov(el){
  el.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="pg" id="mp"></div><div class="pg" id="vp"></div></div><div style="position:relative;height:220px;width:100%"><canvas id="vc"></canvas></div><div class="st" style="margin-top:24px">Aktivitäts-Heatmap</div><div class="heatmap" id="hm"></div><div style="display:flex;gap:3px;align-items:center;margin-top:4px;font-size:9px;color:var(--tx3)"><span>wenig</span><div class="hm-cell" style="background:var(--bg3)"></div><div class="hm-cell" style="background:rgba(46,166,106,.25)"></div><div class="hm-cell" style="background:rgba(46,166,106,.55)"></div><div class="hm-cell" style="background:rgba(46,166,106,.85)"></div><span>viel</span></div><div class="st" style="margin-top:28px">Herzfrequenz-Zonen</div><div class="zone-bar" id="zb"></div><div id="zd"></div>';
  document.getElementById('mp').innerHTML=[['km','Distanz'],['hours','Zeit'],['hm','Höhe'],['trimp','TRIMP'],['n','Einh.']].map(([k,l])=>'<button class="pill '+(S.mt===k?'on':'')+'" onclick="smt(\''+k+'\')">'+l+'</button>').join('');
  document.getElementById('vp').innerHTML=[['monthly','Mo'],['weekly','Wo']].map(([k,l])=>'<button class="pill '+(S.vw===k?'on':'')+'" onclick="svw(\''+k+'\')">'+l+'</button>').join('');
  rvc();rhm();rhz();
}
function rvc(){
  const d=gf();if(!d.length)return;
  const kf=S.vw==='weekly'?r=>iw(r.d):r=>r.d.slice(0,7),g={};
  d.forEach(r=>{const k=kf(r);if(!g[k])g[k]={key:k,km:0,hours:0,hm:0,n:0,trimp:0,fd:r.d};const x=g[k];x.km+=r.km;x.hours+=r.s/3600;x.hm+=r.hm;x.n++;x.trimp+=trimp(r.hr,r.s);});
  const a=Object.values(g).sort((a,b)=>a.key.localeCompare(b.key));
  const labels=a.map(x=>{if(S.vw==='monthly'){const mm=x.key.slice(5,7),yr=x.key.slice(2,4);return(ML[mm]||mm)+(mm==='01'||mm==='06'?" '"+yr:'');}return'KW'+x.key.split('-W')[1];});
  const vals=a.map(x=>Math.round(x[S.mt]*10)/10),colors=a.map(x=>gp(x.fd).bg);
  const ctx=document.getElementById('vc');
  S.ch.vol=new Chart(ctx,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:colors,borderRadius:4,maxBarThickness:S.vw==='weekly'?16:36}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TT,callbacks:{title:c=>c[0]?.label||'',label:c=>{const u={km:'km',hours:'h',hm:'hm',trimp:'TRIMP',n:''};return fm(c.raw,c.raw%1?1:0)+' '+(u[S.mt]||'');}}}},scales:{x:{grid:{display:false},ticks:{...XK,maxRotation:S.vw==='weekly'?45:0}},y:{grid:GR,ticks:YK,beginAtZero:true}}}});
}
function rhm(){
  const d=gf(),dm={};d.forEach(r=>{if(!dm[r.d])dm[r.d]={km:0,n:0};dm[r.d].km+=r.km;dm[r.d].n++;});
  const start=new Date(S.fd),end=new Date(Math.min(new Date(S.td).getTime(),Date.now()));
  let h='',cur=new Date(start);cur.setDate(cur.getDate()-((cur.getDay()+6)%7));
  while(cur<=end){h+='<div class="hm-col">';for(let i=0;i<7;i++){const ds=cur.toISOString().slice(0,10),ok=cur>=start&&cur<=end,day=dm[ds];const int=day?Math.min(1,day.km/70):0;h+='<div class="hm-cell" style="background:'+((!ok)?'transparent':int===0?'var(--bg3)':'rgba(46,166,106,'+(0.1+int*.85)+')')+';'+(ok&&int===0?'border:1px solid var(--bd2)':'')+'" title="'+(day?ds+' · '+fm(day.km,1)+'km':ds)+'"></div>';cur.setDate(cur.getDate()+1);}h+='</div>';}
  document.getElementById('hm').innerHTML=h;
}
function rhz(){
  const d=gf(),z=[{n:'Z1',s:'Erholung',lo:0,hi:126,c:'#B0AEA4'},{n:'Z2',s:'Grundlage',lo:126,hi:146,c:'#44C495'},{n:'Z3',s:'Tempo',lo:146,hi:163,c:'#F5C260'},{n:'Z4',s:'Schwelle',lo:163,hi:178,c:'#E88B5A'},{n:'Z5',s:'VO₂max',lo:178,hi:220,c:'#D64545'}];
  d.filter(r=>r.hr).forEach(r=>{const x=z.find(x=>r.hr>=x.lo&&r.hr<x.hi);if(x)x.sec=(x.sec||0)+r.s;});
  const t=z.reduce((s,x)=>s+(x.sec||0),0)||1;z.forEach(x=>{x.pct=Math.round((x.sec||0)/t*100);x.h=(x.sec||0)/3600;});
  document.getElementById('zb').innerHTML=z.filter(x=>x.pct>0).map(x=>'<div style="flex:'+x.pct+';background:'+x.c+'" title="'+x.n+': '+x.pct+'%"></div>').join('');
  document.getElementById('zd').innerHTML=z.map(x=>'<div class="zone-row"><div class="zone-dot" style="background:'+x.c+'"></div><span style="color:var(--tx2);font-weight:500;width:26px">'+x.n+'</span><span style="color:var(--tx3)">'+x.s+'</span><span class="zone-pct">'+x.pct+'%</span><span style="color:var(--tx3);font-size:10px;width:40px;text-align:right">'+fm(x.h,1)+'h</span></div>').join('');
}

// ═══ PERFORMANCE ═══
function rperf(el){
  el.innerHTML='<div class="st" style="margin-top:0">Effizienz (HF / Geschwindigkeit, höhenbereinigt)</div><div class="ss">Niedriger = fitter · Nur Fahrten >15 min mit HR + Speed</div><div style="position:relative;height:280px;width:100%"><canvas id="ec"></canvas></div><div class="st">Speed & Herzfrequenz (Outdoor ≥ 20 km)</div><div class="ss">Grün = Geschwindigkeit · Rot = Herzfrequenz</div><div style="position:relative;height:240px;width:100%"><canvas id="sc"></canvas></div><div class="st">Kadenz-Entwicklung</div><div style="position:relative;height:180px;width:100%"><canvas id="cc"></canvas></div><div class="st">Trainingsbelastung (TRIMP)</div><div class="ss">Dauer × (HF / MaxHF)²</div><div style="position:relative;height:180px;width:100%"><canvas id="trc"></canvas></div>';
  rec();rspd();rcad();rtrm();
}
function rec(){
  const d=gf().filter(r=>r.hr&&r.v&&r.s>900);
  if(!d.length){document.getElementById('ec').parentElement.innerHTML='<div style="color:var(--tx3);font-size:12px;padding:20px">Keine Fahrten mit HR + Speed > 15 min</div>';return;}
  const pts=d.map(r=>{const e=ae(r),ph=gp(r.d);return{label:r.d.slice(5).replace('-','.'),adj:Math.round(e*100)/100,km:r.km,hr:r.hr,v:r.v,hm:r.hm,c:ph.bg,phase:ph.name,indoor:r.t==='I',d:r.d};});
  const op=pts.filter(p=>!p.indoor),rm={};
  op.forEach((p,i)=>{const w=op.slice(Math.max(0,i-2),i+3);rm[p.d]=Math.round(w.reduce((s,x)=>s+x.adj,0)/w.length*100)/100;});
  S.ch.eff=new Chart(document.getElementById('ec'),{type:'bar',data:{labels:pts.map(p=>p.label),datasets:[
    {type:'line',label:'Trend',data:pts.map(p=>rm[p.d]||null),borderColor:'#2ea66a',borderWidth:2.5,pointRadius:0,tension:.4,fill:false,spanGaps:true,order:0},
    {label:'Effizienz',data:pts.map(p=>p.adj),backgroundColor:pts.map(p=>p.indoor?'rgba('+h2r(p.c)+',.3)':p.c),borderRadius:3,maxBarThickness:14,order:1}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TT,callbacks:{title:c=>{const p=pts[c[0]?.dataIndex];return p?p.d+' · '+p.phase+(p.indoor?' (Indoor)':''):'';},label:c=>{if(c.datasetIndex===0)return'';const p=pts[c.dataIndex];return p?['Effizienz: '+fm(p.adj,2),fm(p.km,1)+' km · '+p.hr+' bpm · '+fm(p.v,1)+' km/h · '+p.hm+' hm']:'';}}}},scales:{x:{grid:{display:false},ticks:{...XK,maxRotation:45,callback:(v,i)=>i%Math.max(1,Math.floor(pts.length/14))===0?pts[i]?.label:''}},y:{reverse:true,min:5,max:10,grid:GR,ticks:YK,title:{display:true,text:'← fitter',font:{family:'DM Sans',size:9},color:'#626d7a'}}}}});
}
function rspd(){
  const d=gf().filter(r=>r.t==='O'&&r.km>=20&&r.hr&&r.v);
  if(!d.length){document.getElementById('sc').parentElement.innerHTML='<div style="color:var(--tx3);font-size:12px;padding:20px">Keine Outdoor-Fahrten ≥ 20 km mit HR</div>';return;}
  S.ch.spd=new Chart(document.getElementById('sc'),{type:'line',data:{labels:d.map(r=>r.d.slice(5).replace('-','.')),datasets:[
    {label:'km/h',data:d.map(r=>r.v),borderColor:'#2ea66a',backgroundColor:'rgba(46,166,106,.06)',fill:true,borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#2ea66a',tension:.3,yAxisID:'v'},
    {label:'bpm',data:d.map(r=>r.hr),borderColor:'#D64545',borderWidth:1.5,borderDash:[5,3],pointRadius:3,pointBackgroundColor:'#D64545',tension:.3,yAxisID:'hr'}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{font:{family:'DM Sans',size:11},color:'#9aa5b4',usePointStyle:true,pointStyle:'circle'}},tooltip:{...TT,callbacks:{title:c=>{const r=d[c[0]?.dataIndex];return r?r.d+' · '+fm(r.km,1)+' km · '+r.hm+' hm':'';}}}},scales:{x:{grid:{display:false},ticks:XK},v:{position:'left',min:12,max:28,grid:GR,ticks:{...YK,color:'#2ea66a'}},hr:{position:'right',min:120,max:180,grid:{display:false},ticks:{...YK,color:'#D64545'}}}}});
}
function rcad(){
  const d=gf().filter(r=>r.rpm&&r.s>600),mo={};d.forEach(r=>{const k=r.d.slice(0,7);if(!mo[k])mo[k]=[];mo[k].push(r.rpm);});const ks=Object.keys(mo).sort();
  if(ks.length<2){document.getElementById('cc').parentElement.innerHTML='<div style="color:var(--tx3);font-size:12px;padding:20px">Zu wenig Kadenzdaten</div>';return;}
  S.ch.cad=new Chart(document.getElementById('cc'),{type:'bar',data:{labels:ks.map(k=>ML[k.slice(5,7)]||k),datasets:[{data:ks.map(k=>Math.round(mo[k].reduce((s,v)=>s+v,0)/mo[k].length)),backgroundColor:ks.map(k=>gp(k+'-01').bg),borderRadius:4,maxBarThickness:28}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:c=>c.raw+' rpm'}}},scales:{x:{grid:{display:false},ticks:XK},y:{min:50,max:95,grid:GR,ticks:YK}}}});
}
function rtrm(){
  const d=gf(),kf=S.vw==='weekly'?r=>iw(r.d):r=>r.d.slice(0,7),g={};
  d.forEach(r=>{const k=kf(r);if(!g[k])g[k]={key:k,trimp:0};g[k].trimp+=trimp(r.hr,r.s);});
  const a=Object.values(g).sort((x,y)=>x.key.localeCompare(y.key));if(!a.length)return;
  S.ch.trm=new Chart(document.getElementById('trc'),{type:'line',data:{labels:a.map(x=>S.vw==='monthly'?ML[x.key.slice(5,7)]||x.key:'KW'+x.key.split('-W')[1]),datasets:[{data:a.map(x=>Math.round(x.trimp)),borderColor:'#db61a2',backgroundColor:'rgba(219,97,162,.08)',fill:true,borderWidth:2,pointRadius:2.5,pointBackgroundColor:'#db61a2',tension:.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:c=>'TRIMP: '+c.raw}}},scales:{x:{grid:{display:false},ticks:XK},y:{grid:GR,ticks:YK,beginAtZero:true}}}});
}

// ═══ LOG ═══
function rlog(el){
  const all=ga().filter(r=>r.d>=S.fd&&r.d<=S.td);
  let shown=all;if(S.tf==='O')shown=shown.filter(r=>r.t==='O');if(S.tf==='I')shown=shown.filter(r=>r.t==='I');
  const ac=shown.filter(r=>!S.ex.has(r.id)).length,xc=shown.length-ac;
  el.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:12px;color:var(--tx3)">'+ac+' Aktivitäten'+(xc?' · <span style="color:var(--orange)">'+xc+' ausgeblendet</span>':'')+'</div>'+(xc?'<button class="btn-sm" onclick="cex()">Alle einblenden</button>':'')+'</div><div class="log-wrap"><div class="log-scroll"><table class="log-table"><thead><tr><th style="width:20px"></th><th>Datum</th><th>Titel</th><th>Phase</th><th title="Klicken zum Umschalten zwischen Outdoor/Indoor" style="cursor:help">Typ ℹ</th><th>km</th><th>Zeit</th><th>HR</th><th>km/h</th><th>hm</th><th>rpm</th><th title="Effizienz = HF ÷ (Speed + hm/km × 0,3)&#10;Niedriger = fitter&#10;Nur berechenbar mit HR und Speed" style="cursor:help;text-decoration:underline dotted">Eff. ℹ</th></tr></thead><tbody>'+[...shown].reverse().map(r=>{
    const ph=gp(r.d),eff=ae(r),effC=eff&&eff<6.5?'color:var(--green)':eff&&eff>7.5?'color:var(--tx3)':'',excl=S.ex.has(r.id),sty=excl?'opacity:.35;text-decoration:line-through;':'',title=r.title.length>22?r.title.slice(0,20)+'…':r.title;
    return'<tr style="'+sty+'"><td style="padding:3px 4px;text-align:center"><input type="checkbox" '+(excl?'':'checked')+' onchange="tex(\''+r.id+'\')"></td><td style="white-space:nowrap">'+r.d.slice(8)+'.'+r.d.slice(5,7)+'.'+r.d.slice(2,4)+'</td><td style="font-size:11px;color:var(--tx2);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+r.title+'">'+title+'</td><td><span class="phase-pill" style="background:'+ph.bg+';color:'+ph.fg+'">'+ph.name+'</span></td><td><button class="type-toggle" style="background:var(--bg3);color:'+(r.t==='O'?'var(--green)':'var(--orange)')+'" onclick="tty(\''+r.id+'\')" title="Klicken: Outdoor ↔ Indoor umschalten">'+(r.t==='O'?'OUT':'IND')+'</button></td><td>'+fm(r.km,1)+'</td><td style="color:var(--tx2)">'+ft(r.s)+'</td><td>'+(r.hr||'–')+'</td><td>'+(r.v?fm(r.v,1):'–')+'</td><td>'+(r.hm>0?fm(r.hm):'–')+'</td><td>'+(r.rpm||'–')+'</td><td style="font-weight:500;'+effC+'" title="'+(eff?'HF÷(Speed+hm/km×0.3) = '+fm(eff,2):'Kein HR oder Speed')+'">'+(eff?fm(eff,2):'–')+'</td></tr>';
  }).join('')+'</tbody></table></div></div>';
}
function tex(id){if(S.ex.has(id))S.ex.delete(id);else S.ex.add(id);render();}
function cex(){S.ex.clear();render();}
function tty(id){const d=ga(),r=d.find(x=>x.id===id);if(!r)return;r.t=r.t==='O'?'I':'O';S.to[id]=r.t;sto();render();}

// ═══ SETTINGS ═══
function rset(el){
  const mos=[];for(let y=2020;y<=2030;y++)for(let m=1;m<=12;m++)mos.push(y+'-'+String(m).padStart(2,'0'));
  el.innerHTML='<div class="st" style="margin-top:0">Trainingsphasen</div><div style="font-size:12px;color:var(--tx3);margin-bottom:16px">Definiere deine Trainingsphasen. Beim Löschen verlängert sich die vorherige Phase automatisch.</div><div id="pe"></div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn-sm" onclick="aph()">+ Phase</button><button class="btn-sm danger" onclick="rph()">Standard</button></div><div class="st">Daten-Info</div><div id="di" style="font-size:12px;color:var(--tx2)"></div>';
  const pe=document.getElementById('pe');
  pe.innerHTML=S.phases.map((p,i)=>{
    const opts=mos.map(m=>'<option value="'+m+'"'+(m===p.from?' selected':'')+'>'+m+'</option>').join('');
    const opts2=mos.map(m=>'<option value="'+m+'"'+(m===p.to?' selected':'')+'>'+m+'</option>').join('');
    return'<div class="setting-row"><input type="color" value="'+p.bg+'" onchange="uph('+i+',\'bg\',this.value)"><input type="text" value="'+p.name+'" onchange="uph('+i+',\'name\',this.value)"><span style="color:var(--tx3);font-size:11px">Von</span><select onchange="uph('+i+',\'from\',this.value)">'+opts+'</select><span style="color:var(--tx3);font-size:11px">Bis</span><select onchange="uph('+i+',\'to\',this.value)">'+opts2+'</select><button class="btn-sm danger" onclick="dph('+i+')" style="padding:4px 10px">×</button></div>';
  }).join('');
  rdi();
}
function uph(i,k,v){S.phases[i][k]=v;if(k==='bg'){const r=parseInt(v.slice(1,3),16),g=parseInt(v.slice(3,5),16),b=parseInt(v.slice(5,7),16);S.phases[i].fg=(r*.299+g*.587+b*.114)>150?'#1a1a2e':'#f0f0f0';}sp();render();}
function aph(){const l=S.phases[S.phases.length-1],nf=l?nm(l.to):'2026-06';S.phases.push({name:'Neue Phase',from:nf,to:nf,bg:'#8B9DC3',fg:'#1a1a2e'});aep();sp();render();}
function dph(i){S.phases.splice(i,1);aep();sp();render();}
function rph(){S.phases=JSON.parse(JSON.stringify(DP));sp();render();}
function nm(ym){const[y,m]=ym.split('-').map(Number);return m===12?(y+1)+'-01':y+'-'+String(m+1).padStart(2,'0');}
function pm(ym){const[y,m]=ym.split('-').map(Number);return m===1?(y-1)+'-12':y+'-'+String(m-1).padStart(2,'0');}
function aep(){S.phases.sort((a,b)=>a.from.localeCompare(b.from));for(let i=0;i<S.phases.length-1;i++){const nxt=S.phases[i+1].from;if(nm(S.phases[i].to)<nxt)S.phases[i].to=pm(nxt);}}
function rdi(){
  const d=ga();if(!d.length){document.getElementById('di').textContent='Keine Daten';return;}
  const ds=d.map(r=>r.d).sort(),tp={};d.forEach(r=>{tp[r.typ]=(tp[r.typ]||0)+1;});
  const nh=d.filter(r=>!r.hr).length,ns=d.filter(r=>!r.v).length,nc=d.filter(r=>!r.rpm).length;
  document.getElementById('di').innerHTML='<div style="margin-bottom:6px">'+ds[0]+' bis '+ds[ds.length-1]+' · '+d.length+' Aktivitäten</div><div style="margin-bottom:6px">'+Object.entries(tp).map(([k,v])=>k+' ('+v+')').join(', ')+'</div><div style="color:var(--tx3)">Fehlende Sensoren: '+nh+'× ohne HF · '+ns+'× ohne Speed · '+nc+'× ohne Kadenz</div>';
}

Chart.defaults.font.family='DM Sans';Chart.defaults.color='#626d7a';render();
</script>
</body>
