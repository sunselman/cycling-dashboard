<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycling Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.7/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0e1117;--bg2:#161b22;--bg3:#1c2129;--bg4:#21262d;--tx:#e6edf3;--tx2:#9aa5b4;--tx3:#626d7a;--bd:#30363d;--bd2:#21262d;--green:#2ea66a;--greenA:rgba(46,166,106,.12);--orange:#d18616;--red:#da3633;--pink:#db61a2;--r:10px}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.4}
.wrap{max-width:840px;margin:0 auto;padding:24px 20px 60px}
.upload-zone{border:2px dashed var(--bd);border-radius:var(--r);padding:40px 24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:24px;position:relative}
.upload-zone:hover,.upload-zone.drag{border-color:var(--green);background:var(--greenA)}
.upload-zone h2{font-size:16px;font-weight:500;margin-bottom:4px}
.upload-zone p{color:var(--tx2);font-size:12px}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.file-chip{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer;transition:all .15s}
.file-chip:hover{border-color:var(--tx3)}
.file-chip.active{border-color:var(--green);background:var(--greenA);color:var(--green)}
.file-chip .count{color:var(--tx3)}
.file-chip .remove{color:var(--tx3);font-size:14px;margin-left:2px;cursor:pointer;border:none;background:none;padding:0}
.file-chip .remove:hover{color:var(--red)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pill-group{display:flex;gap:0;background:var(--bg3);border-radius:999px;padding:3px}
.pill{border:none;background:transparent;color:var(--tx3);font-family:inherit;font-size:11px;font-weight:500;padding:5px 12px;border-radius:999px;cursor:pointer;transition:all .12s}
.pill.on{background:var(--tx);color:var(--bg)}
input[type="date"]{font-family:inherit;font-size:11px;background:var(--bg3);color:var(--tx2);border:1px solid var(--bd);border-radius:6px;padding:5px 10px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
.kpi{padding:14px 16px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.kpi:nth-child(4n){border-right:none}
.kpi:nth-child(n+5){border-bottom:none}
.kpi-label{font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.kpi-val{font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1}
.kpi-unit{font-size:12px;font-weight:400;color:var(--tx3);margin-left:3px}
.kpi-sub{font-size:10px;color:var(--tx3);margin-top:3px}
.tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--bd)}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 18px;font-family:inherit;font-size:13px;font-weight:400;color:var(--tx3);cursor:pointer;transition:all .12s}
.tab.on{color:var(--tx);font-weight:600;border-bottom-color:var(--tx)}
.sec-title{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin-bottom:10px;margin-top:28px}
.sec-sub{font-size:11px;color:var(--tx3);margin-top:-6px;margin-bottom:10px}
.chart-box{position:relative;width:100%;margin-bottom:8px}
.heatmap{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px}
.hm-col{display:flex;flex-direction:column;gap:2px}
.hm-cell{width:9px;height:9px;border-radius:2px}
.zone-bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin-bottom:8px}
.zone-row{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:4px}
.zone-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.zone-pct{font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto}
.log-wrap{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.log-scroll{max-height:520px;overflow-y:auto}
.log-table{width:100%;border-collapse:collapse;font-size:12px}
.log-table thead{position:sticky;top:0;z-index:1}
.log-table th{background:var(--bg3);padding:8px 6px;text-align:left;font-size:9px;font-weight:600;color:var(--tx3);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--bd)}
.log-table td{padding:7px 6px;border-bottom:1px solid var(--bd2);font-variant-numeric:tabular-nums}
.log-table tr:hover td{background:var(--bg2)}
.log-table input[type="checkbox"]{width:14px;height:14px;margin:0;cursor:pointer;accent-color:var(--green)}
.phase-pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:600;letter-spacing:.03em}
.type-toggle{font-family:inherit;font-size:9px;font-weight:600;padding:2px 8px;border-radius:99px;cursor:pointer;border:1px solid var(--bd);transition:all .12s}
.legend{display:flex;gap:14px;justify-content:center;margin-top:24px;padding-top:14px;border-top:1px solid var(--bd);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--tx3);font-weight:500}
.legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.setting-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd2);font-size:13px;flex-wrap:wrap}
.setting-row input[type="text"],.setting-row input[type="color"]{font-family:inherit;font-size:12px;background:var(--bg3);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 10px}
.setting-row input[type="color"]{width:36px;height:28px;padding:2px;cursor:pointer}
.setting-row input[type="text"]{width:100px}
.btn-sm{font-family:inherit;font-size:11px;font-weight:500;padding:5px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);cursor:pointer;transition:all .12s}
.btn-sm:hover{border-color:var(--tx3);color:var(--tx)}
.btn-sm.danger{border-color:var(--red);color:var(--red)}
.btn-sm.danger:hover{background:var(--red);color:#fff}
.tooltip-box{position:absolute;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:14px 18px;font-size:12px;line-height:1.7;color:var(--tx2);z-index:10;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.3);pointer-events:none}
.tooltip-box b{color:var(--tx);font-weight:600}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2n){border-right:none}.controls{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px">
    <div>
      <div style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:3px">Cycling Analytics</div>
      <div style="font-size:22px;font-weight:500">Fitness-Dashboard</div>
    </div>
    <div id="score-display" style="text-align:right;display:none;position:relative;cursor:help" onmouseenter="showScoreTip()" onmouseleave="hideScoreTip()" onclick="toggleScoreTip()">
      <div style="display:flex;align-items:baseline;justify-content:flex-end;gap:3px">
        <span id="score-val" style="font-size:38px;font-weight:500;letter-spacing:-.03em;line-height:1"></span>
        <span style="font-size:13px;color:var(--tx3)">/100</span>
      </div>
      <div id="score-sub" style="font-size:10px;color:var(--tx3);margin-top:2px"></div>
      <div id="score-tip" class="tooltip-box" style="display:none;right:0;top:70px;text-align:left"></div>
    </div>
  </div>

  <!-- DASHBOARD (shown above upload when data exists) -->
  <div id="dashboard" style="display:none">
    <!-- Controls row 1: presets + dates -->
    <div class="controls">
      <div class="pill-group" id="presets"></div>
      <input type="date" id="from-date">
      <span style="color:var(--tx3);font-size:11px">–</span>
      <input type="date" id="to-date">
      <span style="color:var(--tx3);font-size:11px;margin-left:8px" id="range-info"></span>
    </div>
    <!-- Controls row 2: type filter -->
    <div class="controls" style="margin-bottom:20px">
      <div class="pill-group" id="type-filter"></div>
    </div>
    <div class="kpi-grid" id="kpi-grid"></div>
    <div class="tabs" id="tabs"></div>
    <div id="tab-content"></div>
    <div class="legend" id="legend-bar"></div>
  </div>

  <!-- UPLOAD (below dashboard) -->
  <div class="upload-zone" id="upload-zone">
    <h2>Garmin CSV hochladen</h2>
    <p>Drag & Drop oder klicken · Activities.csv von Garmin Connect</p>
    <input type="file" accept=".csv" multiple id="file-input">
  </div>
  <div class="file-list" id="file-list"></div>
</div>
<script>
/* ═══ STATE ═══ */
const S={files:[],activeFile:-1,fromDate:'',toDate:'',preset:0,view:'monthly',metric:'km',tab:'overview',charts:{},excluded:new Set(),typeFilter:'all',phases:null,typeOverrides:{}};

const DEF_PHASES=[
  {name:'Einstieg',from:'2025-06',to:'2025-06',bg:'#AFA9EC',fg:'#5B4FC7'},
  {name:'Aufbau',from:'2025-07',to:'2025-07',bg:'#88DCBC',fg:'#137A5E'},
  {name:'Peak',from:'2025-08',to:'2025-09',bg:'#44C495',fg:'#0C5E3F'},
  {name:'Pause',from:'2026-01',to:'2026-01',bg:'#EB8585',fg:'#8B2222'},
  {name:'Comeback',from:'2026-02',to:'2026-12',bg:'#6BABDF',fg:'#114E80'},
];

function loadPhases(){try{const s=localStorage.getItem('cd-phases');if(s){S.phases=JSON.parse(s);return;}}catch(e){}S.phases=JSON.parse(JSON.stringify(DEF_PHASES));}
function savePhases(){try{localStorage.setItem('cd-phases',JSON.stringify(S.phases));}catch(e){}}
function loadTypeOverrides(){try{const s=localStorage.getItem('cd-type-overrides');if(s)S.typeOverrides=JSON.parse(s);}catch(e){}}
function saveTypeOverrides(){try{localStorage.setItem('cd-type-overrides',JSON.stringify(S.typeOverrides));}catch(e){}}
loadPhases();loadTypeOverrides();

function gp(d){
  const ym=d.slice(0,7);
  for(const p of S.phases){if(ym>=p.from&&ym<=p.to)return p;}
  return{name:'–',bg:'#555',fg:'#ccc'};
}

const PRESETS=[{l:'Gesamt'},{l:"Sommer '25",f:'2025-06-01',t:'2025-09-30'},{l:'Indoor',f:'2025-10-01',t:'2025-12-31'},{l:'2026',f:'2026-01-01',t:'2026-12-31'},{l:'8 Wo',r:56},{l:'4 Wo',r:28}];
const ML={"01":"Jan","02":"Feb","03":"Mär","04":"Apr","05":"Mai","06":"Jun","07":"Jul","08":"Aug","09":"Sep","10":"Okt","11":"Nov","12":"Dez"};
const num=s=>{if(!s||s==='--'||s==='-'||s==='')return null;return parseFloat(s.replace(/\./g,'').replace(',','.'));};
const fm=(v,d=0)=>v==null?'–':d===0?Math.round(v).toLocaleString('de-DE'):v.toFixed(d).replace('.',',');
const ft=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?`${h}h ${m}m`:`${m}m`;};
const trimp=(hr,s)=>hr&&s?(s/60)*Math.pow(hr/195,2):0;
function parseTime(s){if(!s||s==='--')return 0;s=s.trim().replace(',','.');const p=s.split(':');if(p.length===3)return parseInt(p[0])*3600+parseInt(p[1])*60+parseFloat(p[2]);if(p.length===2)return parseInt(p[0])*60+parseFloat(p[1]);return 0;}
function parseDate(s){if(!s)return null;s=s.trim().slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);if(m)return`${m[3]}-${m[2]}-${m[1]}`;return null;}
function isoWeek(ds){const d=new Date(ds+'T12:00:00'),th=new Date(d);th.setDate(th.getDate()+3-((th.getDay()+6)%7));const y1=new Date(th.getFullYear(),0,4);const w=1+Math.round(((th-y1)/864e5-(3-(y1.getDay()+6)%7))/7);return`${th.getFullYear()}-W${String(w).padStart(2,'0')}`;}
function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)].join(',');}
function adjEff(r){if(!r.hr||!r.v)return null;const cpk=r.km>0?r.hm/r.km:0;return r.hr/(r.v+cpk*0.3);}

/* ═══ CSV PARSER ═══ */
function parseCSV(text){
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');const hdr=text.split('\n')[0];const sc=hdr.split(';').length,cm=hdr.split(',').length;const delim=hdr.includes('\t')?'\t':sc>cm?';':',';
  function splitRow(line){const fields=[];let field='',inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];if(inQ){if(ch==='"'){if(i+1<line.length&&line[i+1]==='"'){field+='"';i++;}else inQ=false;}else field+=ch;}else{if(ch==='"')inQ=true;else if(ch===delim){fields.push(field.trim());field='';}else field+=ch;}}fields.push(field.trim());return fields;}
  const lines=text.split('\n'),headers=splitRow(lines[0]),rows=[];
  for(let i=1;i<lines.length;i++){if(!lines[i].trim())continue;const v=splitRow(lines[i]);if(v.length<5)continue;const o={};headers.forEach((h,j)=>o[h]=v[j]||'');rows.push(o);}return rows;
}
function processCSV(text){
  const rows=parseCSV(text),data=[],seen=new Set();let id=0;
  for(const r of rows){
    const typ=r['Aktivitätstyp']||'';
    if(typ.includes('E-Bike')||typ.includes('E-Mountain')||typ.includes('Laufen')||typ.includes('Gehen')||typ.includes('Wandern')||typ.includes('Schwimmen'))continue;
    if(!typ.includes('Rad')&&!typ.includes('Gravel')&&!typ.includes('Indoor')&&!typ.includes('Cycling'))continue;
    const d=parseDate(r['Datum']);if(!d)continue;
    const km=num(r['Distanz']);if(!km||km<=0)continue;
    const key=`${d}|${km}|${r['Zeit']}`;if(seen.has(key))continue;seen.add(key);
    const rid=`${d}_${id++}`;
    const autoType=(typ.includes('Virtuell')||typ.includes('Indoor'))?'I':'O';
    data.push({id:rid,d,t:S.typeOverrides[rid]||autoType,typ,title:r['Titel']||'',km,s:parseTime(r['Zeit']),hr:num(r['Ø Herzfrequenz']),v:num(r['Ø Geschwindigkeit']),hm:num(r['Anstieg gesamt'])||0,rpm:num(r['Ø Trittfrequenz']),cal:num(r['Kalorien'])||0});
  }
  data.sort((a,b)=>a.d.localeCompare(b.d));return data;
}

/* ═══ FILE HANDLING ═══ */
const uploadZone=document.getElementById('upload-zone'),fileInput=document.getElementById('file-input');
uploadZone.addEventListener('dragover',e=>{e.preventDefault();uploadZone.classList.add('drag');});
uploadZone.addEventListener('dragleave',()=>uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop',e=>{e.preventDefault();uploadZone.classList.remove('drag');handleFiles(e.dataTransfer.files);});
fileInput.addEventListener('change',e=>handleFiles(e.target.files));
function handleFiles(files){for(const file of files){if(!file.name.endsWith('.csv'))continue;const reader=new FileReader();reader.onload=e=>{const data=processCSV(e.target.result);if(!data.length)return;const idx=S.files.findIndex(f=>f.name===file.name);if(idx>=0)S.files[idx].data=data;else S.files.push({name:file.name,data});S.activeFile=S.files.length-1;initDateRange();render();};reader.readAsText(file,'UTF-8');}}
function initDateRange(){const data=getActive();if(!data.length)return;const dates=data.map(r=>r.d).sort();S.fromDate=dates[0];S.toDate=new Date().toISOString().slice(0,10);S.preset=0;document.getElementById('from-date').value=S.fromDate;document.getElementById('to-date').value=S.toDate;}
function getActive(){if(S.activeFile<0||!S.files[S.activeFile])return[];return S.files[S.activeFile].data;}
function getFiltered(){
  let d=getActive().filter(r=>r.d>=S.fromDate&&r.d<=S.toDate&&!S.excluded.has(r.id));
  if(S.typeFilter==='O')d=d.filter(r=>r.t==='O');
  if(S.typeFilter==='I')d=d.filter(r=>r.t==='I');
  return d;
}
function selectFile(i){S.activeFile=i;S.excluded.clear();initDateRange();render();}
function removeFile(i){S.files.splice(i,1);if(S.activeFile>=S.files.length)S.activeFile=S.files.length-1;if(S.files.length)initDateRange();render();}

/* ═══ RENDER ═══ */
function render(){
  const has=S.files.length>0;document.getElementById('dashboard').style.display=has?'':'none';
  renderFileChips();if(!has)return;
  renderPresets();renderTypeFilter();renderRangeInfo();renderKPIs();renderTabs();renderTabContent();renderScore();renderLegend();
}
function renderFileChips(){document.getElementById('file-list').innerHTML=S.files.map((f,i)=>`<div class="file-chip ${i===S.activeFile?'active':''}" onclick="selectFile(${i})"><span>${f.name}</span><span class="count">${f.data.length}</span><button class="remove" onclick="event.stopPropagation();removeFile(${i})">×</button></div>`).join('');}
function renderPresets(){document.getElementById('presets').innerHTML=PRESETS.map((p,i)=>`<button class="pill ${S.preset===i?'on':''}" onclick="applyPreset(${i})">${p.l}</button>`).join('');}
function renderTypeFilter(){document.getElementById('type-filter').innerHTML=[['all','Alle'],['O','Outdoor'],['I','Indoor']].map(([k,l])=>`<button class="pill ${S.typeFilter===k?'on':''}" onclick="setTypeFilter('${k}')">${l}</button>`).join('');}
function setTypeFilter(t){S.typeFilter=t;render();}
function applyPreset(i){S.preset=i;const p=PRESETS[i];if(p.r){const e=new Date(),s=new Date(e-p.r*864e5);S.fromDate=s.toISOString().slice(0,10);S.toDate=e.toISOString().slice(0,10);}else if(p.f){S.fromDate=p.f;S.toDate=p.t;}else{const dates=getActive().map(r=>r.d).sort();S.fromDate=dates[0]||'2025-01-01';S.toDate=new Date().toISOString().slice(0,10);}document.getElementById('from-date').value=S.fromDate;document.getElementById('to-date').value=S.toDate;render();}
document.getElementById('from-date').addEventListener('change',e=>{S.fromDate=e.target.value;S.preset=-1;render();});
document.getElementById('to-date').addEventListener('change',e=>{S.toDate=e.target.value;S.preset=-1;render();});
function renderRangeInfo(){const d=getFiltered();document.getElementById('range-info').textContent=`${d.length} Aktivitäten · ${new Set(d.map(r=>r.d)).size} Tage`;}
function renderLegend(){document.getElementById('legend-bar').innerHTML=S.phases.map(p=>`<span><span class="legend-dot" style="background:${p.bg}"></span>${p.name}</span>`).join('');}

/* ═══ KPIs ═══ */
function renderKPIs(){
  const d=getFiltered(),km=d.reduce((s,r)=>s+r.km,0),sec=d.reduce((s,r)=>s+r.s,0),hm=d.reduce((s,r)=>s+r.hm,0),cal=d.reduce((s,r)=>s+r.cal,0);
  const wH=d.filter(r=>r.hr),wV=d.filter(r=>r.v),wR=d.filter(r=>r.rpm);
  const aHr=wH.length?wH.reduce((s,r)=>s+r.hr,0)/wH.length:null,aV=wV.length?wV.reduce((s,r)=>s+r.v,0)/wV.length:null,aR=wR.length?wR.reduce((s,r)=>s+r.rpm,0)/wR.length:null;
  const weeks=Math.max(1,Math.ceil((new Date(S.toDate)-new Date(S.fromDate))/6048e5));
  const kpis=[{l:'Distanz',v:fm(km),u:'km',s:`${d.filter(r=>r.t==='O').length} outdoor · ${d.filter(r=>r.t==='I').length} indoor`},{l:'Fahrzeit',v:ft(sec),u:'',s:`Ø ${ft(d.length?sec/d.length:0)} / Einheit`},{l:'Höhenmeter',v:fm(hm),u:'hm',s:''},{l:'Kalorien',v:fm(cal),u:'kcal',s:''},{l:'Ø Herzfrequenz',v:fm(aHr),u:'bpm',s:''},{l:'Ø Geschwindigkeit',v:fm(aV,1),u:'km/h',s:''},{l:'Ø Kadenz',v:fm(aR),u:'rpm',s:''},{l:'Ø / Woche',v:fm(km/weeks),u:'km',s:''}];
  document.getElementById('kpi-grid').innerHTML=kpis.map(k=>`<div class="kpi"><div class="kpi-label">${k.l}</div><div class="kpi-val">${k.v}<span class="kpi-unit">${k.u}</span></div>${k.s?`<div class="kpi-sub">${k.s}</div>`:''}</div>`).join('');
}

/* ═══ FITNESS SCORE ═══ */
function calcScore(){
  const d=getFiltered().filter(r=>r.hr&&r.v&&r.s>900&&r.t==='O');
  if(d.length<3)return null;
  const effs=d.map(r=>{const e=adjEff(r);return{e,km:r.km,hr:r.hr,v:r.v,hm:r.hm,d:r.d};});
  const vals=effs.map(x=>x.e),best=Math.min(...vals),worst=Math.max(...vals),range=worst-best||1;
  const cur=vals[vals.length-1],prev=vals.length>=4?vals[vals.length-4]:cur;
  const sc=v=>Math.round(((worst-v)/range)*100);
  const lastR=effs[effs.length-1],bestR=effs[vals.indexOf(best)];
  return{cur:sc(cur),peak:sc(best),trend:cur<prev?'up':'down',rawCur:cur,rawBest:best,lastR,bestR,count:d.length};
}
function renderScore(){
  const sc=calcScore(),el=document.getElementById('score-display');
  if(!sc){el.style.display='none';return;}el.style.display='';
  document.getElementById('score-val').textContent=sc.cur;
  document.getElementById('score-val').style.color=sc.trend==='up'?'var(--green)':'var(--orange)';
  document.getElementById('score-sub').textContent=`${sc.trend==='up'?'↗':'↘'} Fitness · Peak ${sc.peak}`;
  // Prepare tooltip content
  document.getElementById('score-tip').innerHTML=`
    <b>Fitness-Score: ${sc.cur}/100</b><br><br>
    Der Score basiert auf der <b>höhenbereinigten Effizienz</b> (HF ÷ adjustierte Geschwindigkeit) deiner Outdoor-Fahrten über 15 Minuten.<br><br>
    <b>Formel:</b> Effizienz = HF ÷ (Speed + Höhenmeter/km × 0,3)<br>
    Niedrigere Werte = fitter (weniger Herzschläge pro km/h).<br><br>
    <b>Aktuell:</b> ${fm(sc.rawCur,2)} (${sc.lastR.d} · ${fm(sc.lastR.km,1)}km · ${sc.lastR.hr}bpm · ${fm(sc.lastR.v,1)}km/h)<br>
    <b>Peak:</b> ${fm(sc.rawBest,2)} (${sc.bestR.d} · ${fm(sc.bestR.km,1)}km)<br><br>
    Score = Position zwischen schlechtestem und bestem Wert, skaliert auf 0–100. Basiert auf ${sc.count} Outdoor-Fahrten.`;
}

function renderVolChart(){

function renderHeatmap(){

function renderHRZones(){
  const d=getFiltered(),zones=[{n:'Z1',s:'Erholung',lo:0,hi:126,c:'#B0AEA4'},{n:'Z2',s:'Grundlage',lo:126,hi:146,c:'#44C495'},{n:'Z3',s:'Tempo',lo:146,hi:163,c:'#F5C260'},{n:'Z4',s:'Schwelle',lo:163,hi:178,c:'#E88B5A'},{n:'Z5',s:'VO₂max',lo:178,hi:220,c:'#D64545'}];

  document.getElementById('zone-bar').innerHTML=zones.filter(z=>z.pct>0).map(z=>`<div style="flex:${z.pct};background:${z.c}" title="${z.n}: ${z.pct}%"></div>`).join('');

}

function renderSettings(el){
  el.innerHTML=`<div class="sec-title" style="margin-top:0">Trainingsphasen definieren</div><div style="font-size:12px;color:var(--tx3);margin-bottom:16px">Phasen decken automatisch den gesamten Zeitraum ab. Wenn du eine Phase löschst, verlängert sich die vorherige Phase bis zum Start der nächsten. Format Von/Bis: YYYY-MM</div><div id="phase-editor"></div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn-sm" onclick="addPhase()">+ Phase hinzufügen</button><button class="btn-sm danger" onclick="resetPhases()">Standard wiederherstellen</button></div><div class="sec-title">Daten-Info</div><div id="data-info" style="font-size:12px;color:var(--tx2)"></div>`;
  renderPhaseEditor();renderDataInfo();

function renderPhaseEditor(){
  document.getElementById('phase-editor').innerHTML=S.phases.map((p,i)=>`<div class="setting-row"><input type="color" value="${p.bg}" onchange="updatePhase(${i},'bg',this.value)"><input type="text" value="${p.name}" placeholder="Name" onchange="updatePhase(${i},'name',this.value)" style="width:100px"><span style="color:var(--tx3);font-size:11px">Von</span><input type="text" value="${p.from}" placeholder="YYYY-MM" onchange="updatePhase(${i},'from',this.value)" style="width:85px"><span style="color:var(--tx3);font-size:11px">Bis</span><input type="text" value="${p.to}" placeholder="YYYY-MM" onchange="updatePhase(${i},'to',this.value)" style="width:85px"><button class="btn-sm danger" onclick="removePhase(${i})" style="padding:4px 10px">×</button></div>`).join('');
}
function updatePhase(i,key,val){
  S.phases[i][key]=val;
  if(key==='bg'){const r=parseInt(val.slice(1,3),16),g=parseInt(val.slice(3,5),16),b=parseInt(val.slice(5,7),16);S.phases[i].fg=(r*.299+g*.587+b*.114)>150?'#1a1a2e':'#f0f0f0';}
  savePhases();render();
}
function addPhase(){
  const last=S.phases[S.phases.length-1];
  const nextFrom=last?nextMonth(last.to):'2026-06';
  S.phases.push({name:'Neue Phase',from:nextFrom,to:nextFrom,bg:'#8B9DC3',fg:'#1a1a2e'});
  autoExtendPhases();savePhases();render();
}
function removePhase(i){S.phases.splice(i,1);autoExtendPhases();savePhases();render();}
function resetPhases(){S.phases=JSON.parse(JSON.stringify(DEF_PHASES));savePhases();render();}
function nextMonth(ym){const[y,m]=ym.split('-').map(Number);return m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`;}
function prevMonth(ym){const[y,m]=ym.split('-').map(Number);return m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`;}
function autoExtendPhases(){
  // After removal: extend previous phase's 'to' to fill gap to next phase's 'from'
  S.phases.sort((a,b)=>a.from.localeCompare(b.from));
  for(let i=0;i<S.phases.length-1;i++){
    const gap=S.phases[i+1].from;
    const expected=nextMonth(S.phases[i].to);
    if(expected<gap)S.phases[i].to=prevMonth(gap);
  }
}
function renderDataInfo(){
  const d=getActive();if(!d.length){document.getElementById('data-info').textContent='Keine Daten geladen';return;}
  const dates=d.map(r=>r.d).sort(),types={};d.forEach(r=>{types[r.typ]=(types[r.typ]||0)+1;});
  const noHr=d.filter(r=>!r.hr).length,noSpd=d.filter(r=>!r.v).length,noCad=d.filter(r=>!r.rpm).length;
  document.getElementById('data-info').innerHTML=`<div style="margin-bottom:6px">${dates[0]} bis ${dates[dates.length-1]} · ${d.length} Aktivitäten</div><div style="margin-bottom:6px">${Object.entries(types).map(([k,v])=>`${k} (${v})`).join(', ')}</div><div style="color:var(--tx3)">Fehlende Sensordaten: ${noHr}× ohne HF · ${noSpd}× ohne Speed · ${noCad}× ohne Kadenz</div>`;
}

/* ═══ INIT ═══ */
Chart.defaults.font.family='DM Sans';Chart.defaults.color='#626d7a';render();
</script>
</body>
